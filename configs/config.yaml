# Central config for the XAI-IDS pipeline. Every path, hyperparameter, and toggle
# used by src/, pipelines/, and dashboard/ lives here — nothing should be hardcoded
# in code. To swap models, change `model.type` and add a matching branch in
# src/models/model_factory.py (see that file for the one-line-per-model pattern).

project:
  name: "xai-ids"
  seed: 42

paths:
  raw_dir: "data/raw"
  processed_dir: "data/processed"
  models_dir: "models_saved"
  results_dir: "results"
  unsw_train: "data/raw/unsw_nb15_train.csv"
  unsw_test: "data/raw/unsw_nb15_test.csv"
  cic_file: "data/raw/cicids2017_combined.csv"
  feature_ranking: "results/feature_ranking_{source}.csv"   # one file per ranking_source (+ "_48f" for the full pool, see feature_selection.pool)

data:
  label_column: "label"                        # binary: 0 = normal, 1 = attack
  target_column: "label_merged"                # primary multiclass target used for training/explanations
  fine_grained_target_column: "attack_cat"     # original, ungrouped attack categories (kept for diagnostics)
  normal_category: "Normal"
  # Categories withheld from training entirely to simulate zero-day / open-set attacks.
  unknown_attack_categories: ["Worms", "Shellcode"]
  # true: train on unsw_nb15_train.csv, test on unsw_nb15_test.csv (the official split;
  # exact duplicates are dropped first, train copies win). false: pool both files and
  # split randomly with `test_size`. Synthetic fallback data always splits randomly.
  use_official_split: true
  test_size: 0.2   # random-split mode only
  val_size: 0.15   # fraction of the training rows held out to choose the open-set threshold
  synthetic_fallback_rows: 4000  # used only if raw dataset files are missing
  cic_max_rows: 200000           # CICIDS2017 is stratified-subsampled to this many rows for the cross-dataset study

  # Original fine-grained classes whose recall is reported as `fine_recall_<class>`: the share of
  # their test rows predicted as the label that contains them under the active scheme, so a
  # merge cannot hide them.
  report_fine_recall: ["Analysis", "Backdoor", "DoS", "Exploits", "Fuzzers", "Generic", "Reconnaissance", "Normal"]

  # Label scheme for the primary classification target: a named entry of `label_schemes`.
  # Pick another with `data.label_scheme` (outputs of a non-"current" scheme carry its name
  # in their filenames and never overwrite the default's).
  #
  # Why "current" merges Analysis/Backdoor/DoS: most of their rows have an exact feature twin
  # in another class (72-80% of Analysis/Backdoor/DoS rows in the 34-feature data), so no
  # classifier on these columns can separate them reliably; medians alone would not show
  # that, exact twins do. The official UNSW-NB15 release also has sttl, dttl, ct_state_ttl,
  # ct_srv_src, ct_dst_ltm, ct_src_ltm, ct_srv_dst and ct_dst_src_ltm, which the data/raw copy
  # of this project lacks; restoring them does NOT remove the overlap (twin share with another
  # class, 34 -> 42 features: Analysis 72.0 -> 72.0%, Backdoor 78.9 -> 76.7%, DoS 79.7 -> 79.5%;
  # they mainly help Fuzzers 21.1 -> 11.4% and Reconnaissance 35.4 -> 18.0%). Within the merged
  # group, Exploits is the class that shares feature vectors most (78% of group rows have an
  # exact twin in Exploits, 77% in Fuzzers, 72% in Reconnaissance, 33% in Generic, 0.1% in
  # Normal) -- hence the "wide" scheme. Coarser labels raise the best-possible accuracy
  # mechanically (8 classes 0.905, current merge 0.912, wide 0.969), so that number measures
  # the information a merge discards, not which merge is right. See scripts/overlap_analysis.py.
  # The fine-grained column is preserved (`fine_grained_target_column` above).
  label_scheme: "current"
  label_schemes:
    current:
      merge_groups:
        "Overlap-Group-1": ["Analysis", "Backdoor", "DoS"]
    none:                      # 8 known classes, nothing merged
      merge_groups: {}
    wide:                      # current merge plus Exploits
      merge_groups:
        "Overlap-Group-2": ["Analysis", "Backdoor", "DoS", "Exploits"]
    hierarchical:              # stage 1 attack vs. normal, stage 2 attack family (8 classes out)
      merge_groups: {}
      hierarchical: true

feature_selection:
  # Feature pool: "auto" = the 48-feature pool when the data has the 8 extra official columns, else the
  # 40-feature one; "base" forces the 40-feature pool on any data (to compare 40 vs 48 on the same
  # rows); "full" requires the extra columns. The full pool's outputs carry the suffix "_48f" (rankings,
  # CSVs, models), so the two pools' results sit side by side and never overwrite each other.
  pool: "auto"
  active_set: "40"   # one of: "40", "30", "20", "15" — see configs/feature_sets.yaml
  # "mutual_info": rank the pool by mutual information on the training split (generated);
  # "curated": the hand-written order in feature_sets.yaml (feature_curated_rank).
  ranking_source: "mutual_info"
  ranking_max_rows: 20000   # training rows used for the mutual-information ranking
  redundancy_threshold: null   # e.g. 0.8: push features correlated above this with a better-ranked one down

model:
  class_weight_power: 0.5   # sample weights = balanced ** this (0 unweighted, 1 fully balanced); see src/preprocessing.balanced_sample_weight
  type: "xgboost"     # swap target: "xgboost" | "random_forest" | "logistic_regression"
  params:
    n_estimators: 400
    max_depth: 8
    learning_rate: 0.08
    subsample: 0.9
    colsample_bytree: 0.9
    min_child_weight: 3
    reg_lambda: 1.5
    random_state: 42
    n_jobs: -1
    eval_metric: "mlogloss"

evaluation:
  ece_bins: 15   # equal-width confidence bins of the expected calibration error

open_set:
  enabled: true
  # The threshold is chosen per model on KNOWN validation data (never on the reported
  # zero-day samples): the max-softmax-confidence quantile that flags at most
  # `target_false_unknown_rate` of known validation flows as "Unknown".
  target_false_unknown_rate: 0.05
  # Fallback only, used by the dashboard when a model has no saved open_set_*.json.
  confidence_threshold: 0.65
  unknown_label: "Unknown"

xai:
  shap_background_samples: 100   # background rows for non-tree explainers
  importance_samples: 2000       # rows used for global SHAP importance (stability study, cross-dataset)
  top_k_features: 5

narrative:
  # Suggested remediation action per attack category, used by NarrativeGenerator.
  suggested_actions:
    DoS: "Consider rate-limiting or temporarily blocking this source IP."
    Exploits: "Isolate the target host and check for unpatched vulnerabilities."
    Fuzzers: "Inspect the application for crash logs; consider input validation hardening."
    Generic: "Review firewall rules for this flow's protocol/service combination."
    Reconnaissance: "Flag source IP for monitoring; likely pre-attack scanning."
    Analysis: "Review web server logs for injection or scanning patterns."
    Backdoor: "Isolate host immediately and inspect for persistence mechanisms."
    Worms: "Quarantine the host and scan the subnet for lateral movement."
    Shellcode: "Isolate host and inspect payload for known exploit signatures."
    Unknown: "Unrecognized pattern — escalate to a human analyst for manual review."
    Normal: "No action required."
    "Overlap-Group-1": >-
      Flagged as DoS, Backdoor, or Analysis-type behavior — this dataset's flow-level
      features can't reliably distinguish the three. Escalate for manual / packet-level
      inspection to determine the specific subtype.
    "Overlap-Group-2": >-
      Flagged as Exploits, DoS, Backdoor, or Analysis-type behavior — these four share
      flow-level feature vectors in this dataset, so the classifier can't tell them apart.
      Isolate the host, then escalate for packet-level inspection to find the exact subtype.

logging:
  level: "INFO"
  log_file: "results/pipeline.log"

experiments:
  feature_sets: ["40", "30", "20", "15"]
  # Tiers used instead when the 8 extra official columns are present (feature_pool_full, 48 features):
  feature_sets_full: ["48", "40", "30", "20", "15"]
  open_set_modes: [false, true]
  # Filenames only -- written under results/metrics/<model.type>/ (see
  # src.utils.config_loader.get_metrics_dir), so switching model.type never
  # overwrites another model's numbers, same reasoning as get_dashboard_paths.
  output_csv: "experiment_results.csv"
  stability_csv: "explanation_stability.csv"
  cross_dataset_csv: "cross_dataset_results.csv"
  baselines_csv: "feature_selection_baselines.csv"   # ranked / random draws / worst-N (closed-set metrics)
  baselines_summary_csv: "feature_selection_baselines_summary.csv"
  pooled_split_csv: "pooled_split_results.csv"
  split_summary_csv: "split_summary.csv"
  # false: only the active_set tier (feature_selection.active_set) gets open_set_sweep_<tier>.csv and
  # overlap_diagnostic_<tier>.csv; true: every tier does.
  save_per_tier_diagnostics: false
  run_nonredundant: false     # also run the grid with redundancy_threshold below, into *_nonredundant files
  nonredundant_threshold: 0.8
  random_baseline_draws: 10   # independent random feature subsets per tier
  report_pooled_split: true   # also report metrics on a pooled random split (pooled_split_results.csv)
  headline_seeds: [42, 43, 44, 45, 46]   # pipelines/run_headline_seeds.py: mean +/- std of the headline metrics
  stability_seeds: [43, 44]   # extra seeds for the same-feature-set stability reference

dashboard:
  # Which trained model artifact the API loads: models_saved/<model.type>/<model.type>_
  # <feature_set>_closed.<ext> (derived by src.utils.config_loader.get_dashboard_paths —
  # not a separate hardcoded path, so switching `model.type` above and retraining is
  # the only step needed; there's nothing else here to keep in sync).
  feature_set: "40"
  max_rows: 500   # /predict rejects uploads with more rows (SHAP + narrative per row)
