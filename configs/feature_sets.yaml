# Feature sets for the Feature-Selection + Explanation Consistency Study (novelty #3).
#
# `feature_pool` is the full set of candidate features. It is NOT a ranking: the
# importance ranking is computed from the training split (mutual information with the
# target) by src/feature_selection.compute_feature_ranking and written to
# results/rankings/feature_ranking_mutual_info.csv by run_all_experiments; the 30/20/15 sets are the
# top-N of the ranking chosen by feature_selection.ranking_source (src/utils/config_loader.get_active_features).
# The pool's list order carries no meaning (feature_curated_rank below is the hand-written
# order); with no ranking file, get_active_features raises instead of guessing.
#
# The official UNSW-NB15 training/testing set has 42 raw feature columns. The copy in this
# project's data/raw lacks 8 of them (sttl, dttl, ct_state_ttl, ct_srv_src, ct_dst_ltm,
# ct_src_ltm, ct_srv_dst, ct_dst_src_ltm), leaving 34 raw columns; with the 6 engineered
# features below that is the 40-feature `feature_pool`. When the loaded data has all 8
# columns, `feature_pool_full` (42 raw + 6 engineered = 48) is used instead, automatically
# (src.utils.config_loader.choose_pool); the pool name is logged and recorded in results and
# in each saved preprocessor. A tier name always equals its n_features ("48" only exists
# with the full pool; experiments.feature_sets_full lists that run's tiers).
#
# `categorical_features` marks which are categorical (label-encoded in preprocessing)
# instead of numeric (scaled). `engineered_features` marks the 6 features derived in
# src/preprocessing.py from the raw flow fields (not present in the raw dataset).

feature_pool:
  - rate
  - sload
  - dload
  - sbytes
  - dbytes
  - smean
  - dmean
  - dur
  - spkts
  - dpkts
  - proto
  - service
  - state
  - sjit
  - djit
  - tcprtt
  - synack
  - ackdat
  - sinpkt
  - dinpkt
  - swin
  - dwin
  - total_bytes
  - total_pkts
  - byte_ratio
  - pkt_ratio
  - avg_pkt_size
  - duration_log
  - ct_src_dport_ltm
  - ct_dst_sport_ltm
  - sloss
